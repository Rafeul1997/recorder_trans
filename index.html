<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio File Transcriber & Translator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>Audio Transcriber</h1>
    <p class="subtitle">Upload an audio file to transcribe and translate</p>

    <!-- Language Selectors -->
    <div class="language-bar">
      <div class="lang-group">
        <label for="sourceLangSelect">Audio Language:</label>
        <select id="sourceLangSelect">
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="hi">Hindi</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ar">Arabic</option>
          <option value="pt">Portuguese</option>
          <option value="ru">Russian</option>
        </select>
      </div>

      <span class="arrow">➜</span>

      <div class="lang-group">
        <label for="targetLangSelect">Translate to:</label>
        <select id="targetLangSelect">
          <option value="Spanish">Spanish</option>
          <option value="French">French</option>
          <option value="German">German</option>
          <option value="English">English</option>
          <option value="Hindi">Hindi</option>
          <option value="Chinese">Chinese</option>
          <option value="Japanese">Japanese</option>
          <option value="Arabic">Arabic</option>
          <option value="Portuguese">Portuguese</option>
          <option value="Russian">Russian</option>
        </select>
      </div>
    </div>

    <!-- Text Area Wrapper -->
    <div class="textbox-wrapper">
      <textarea id="outputText" placeholder="Uploaded audio transcript will appear here..."></textarea>
      <button id="copyBtn" class="copy-btn">Copy Text</button>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button id="translateBtn" class="translate-btn">🌐 Translate Text</button>
      <button id="showOriginalBtn" class="secondary-btn" style="display: none;">↩ Show Original</button>
    </div>

    <!-- Upload Controls -->
    <div class="controls">
      <label for="audioFileInput" class="upload-btn" title="Upload Audio File">
        <svg viewBox="0 0 24 24" width="32" height="32">
          <path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/>
        </svg>
        <input type="file" id="audioFileInput" accept="audio/mp3, audio/wav, audio/m4a, audio/webm, audio/mpeg, audio/mp4" style="display: none;">
      </label>
      <span id="statusText" class="status-text">Click icon to upload an audio file</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
